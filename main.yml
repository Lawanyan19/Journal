name: Envoi du Journal IA

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # <-- Cette ligne fait disparaître l'avertissement

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les bibliothèques
        run: |
          pip install feedparser google-genai

      - name: Executer le script journal.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python journal.py
